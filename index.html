<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>EXC3_B: AREA OF A TRIANGLE</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

	<link rel="stylesheet" type="text/css" href="style.css">

</head>
<body>

	<div class="container">

		<h1><b>Area of a Triangle</b></h1>

		<hr />

		<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Regular_triangle.svg/800px-Regular_triangle.svg.png">

		<br />
		<br />

		<!-- FORM -->
		<form>
			<label for="height">height: </label>
			<input type="number" name="height" id="t_height">

			<br />
			<br />

			<label for="base">base: </label>
			<input type="number" name="base" id="t_base">
		</form>

		<br />

		<h3 id="t_area">The area of a triangle is . . . </h3>

		<br />
		<br />

		<!-- BUTTON -->
		<button type="button" id="button" class="btn btn-dark" onclick="triArea()">AREA BUTTON 🤓👆</button>
		<br />
		<br />
		<button type="button" id="button" class="btn btn-dark" onclick="window.location.reload()">RELOAD PAGE</button>


		<!-- FUNCTION -->
		<script type="text/javascript">

		function triArea(){
			var height= document.getElementById('t_height').value;
			var base = document.getElementById('t_base').value;
			var area= base*height;
			var r_area = area.toFixed(2);

			document.getElementById('t_area') .innerHTML='The area of a triangle is '  + r_area + '!';
		}
			
		</script>

 </div>

	<div class="footer">
		<p>YAO, Harmony Gail K. | 9 Topaz</p>
	</div>

</body>
</html>
